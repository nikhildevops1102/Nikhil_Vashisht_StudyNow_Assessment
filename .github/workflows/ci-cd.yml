name: CI/CD

on:
  push:
    branches:
      - assessment
  workflow_dispatch:

jobs:
  build-test-deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show environment
        run: |
          docker --version
          docker compose version
          git --version

      - name: Validate Docker Compose
        run: |
          cp .env.example .env
          docker compose config -q
          rm -f .env

      - name: Build application images
        run: |
          cp .env.example .env
          docker compose build api-blue api-green nginx
          rm -f .env

      - name: Sync deployment checkout
        working-directory: /opt/study-now/mern-stack-example
        run: |
          git fetch origin "$GITHUB_SHA"
          git reset --hard "$GITHUB_SHA"

      - name: Verify production MongoDB health
        working-directory: /opt/study-now/mern-stack-example
        run: |
          if ! docker compose ps --format '{{.Service}} {{.Health}}' mongodb | grep -q 'mongodb healthy'; then
            echo "MongoDB is not healthy."
            docker compose ps
            docker compose logs mongodb
            exit 1
          fi

          echo "MongoDB is healthy."

      - name: Deploy using blue-green strategy
        working-directory: /opt/study-now/mern-stack-example
        run: |
          ./scripts/deploy.sh

      - name: Verify production application health
        run: |
          curl --fail --silent --show-error \
            http://localhost:8080/health

      - name: Verify production API endpoint
        run: |
          curl --fail --silent --show-error \
            http://localhost:8080/record

      - name: Show active backend
        working-directory: /opt/study-now/mern-stack-example
        run: |
          echo "Active backend:"
          cat nginx/active-backend.conf

      - name: Show production container status
        if: always()
        working-directory: /opt/study-now/mern-stack-example
        run: |
          docker compose ps
